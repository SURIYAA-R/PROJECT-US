<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letters — Our Space</title>
  <meta name="description" content="A quiet place for thoughts, just for the two of you." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <style>
    /* ============================
       CSS CUSTOM PROPERTIES
    ============================ */
    :root {
      --bg-start: #eef0e2;
      --bg-end: #f8f5ec;
      --surface: rgba(255, 255, 255, 0.5);
      --ink: #33422f;
      --dusk: #8a9683;
      --seal-start: #c3d6ac;
      --seal-end: #8fa878;
      --seal: #a9d6a0;
      --gold: #a68a52;
      --line: #dde3cd;
      --primary: #40683c;
      --primary-container: #a9d6a0;
      --on-primary-container: #375e33;
      --surface-variant: #dae6d1;
      --on-surface-variant: #42493f;
      --outline: #72796f;
      --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============================
       RESET & BASE
    ============================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================
       TOP NAV BAR
    ============================ */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(51, 66, 47, 0.08);
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .nav-logo span {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--on-primary-container);
    }

    .nav-title {
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-link {
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--primary);
      transition: opacity 0.2s ease;
    }

    .nav-link:hover { opacity: 0.7; }

    .nav-link-inactive {
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--on-surface-variant);
      text-decoration: none;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nav-link-inactive:hover {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .nav-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--on-surface-variant);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .nav-icon-btn:hover { background: rgba(218, 230, 209, 0.5); }

    /* ============================
       MAIN CONTENT
    ============================ */
    .page-main {
      max-width: 750px;
      margin: 0 auto;
      padding: 48px 20px 64px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .page-header h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .page-header p {
      font-size: 0.95rem;
      color: var(--on-surface-variant);
    }

    /* ============================
       GLASS PANEL
    ============================ */
    .glass-panel {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      border-left: 1px solid rgba(255, 255, 255, 0.4);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(51, 66, 47, 0.08);
    }

    /* ============================
       COMPOSER SECTION
    ============================ */
    .composer {
      padding: 24px;
      display: flex;
      flex-direction: column;
      min-height: 420px;
    }

    .composer h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .composer-form {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .composer-input,
    .composer-textarea {
      width: 100%;
      background: rgba(248, 250, 230, 0.6);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.92rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
    }

    .composer-input::placeholder,
    .composer-textarea::placeholder {
      color: var(--outline);
    }

    .composer-input:focus,
    .composer-textarea:focus {
      border-color: var(--primary-container);
      box-shadow: 0 0 0 3px rgba(169, 214, 160, 0.3), inset 0 1px 3px rgba(0, 0, 0, 0.04);
    }

    .composer-input {
      margin-bottom: 14px;
    }

    .composer-textarea {
      flex: 1;
      min-height: 180px;
      resize: none;
      margin-bottom: 16px;
    }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .composer-heart-btn {
      background: none;
      border: none;
      color: var(--outline);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: color 0.2s ease, transform 0.15s ease;
    }

    .composer-heart-btn:hover { color: var(--primary); transform: scale(1.15); }

    .publish-btn {
      background: linear-gradient(135deg, var(--seal-start), var(--seal-end));
      color: #1e3019;
      border: none;
      border-radius: 9999px;
      padding: 10px 28px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(143, 168, 120, 0.3);
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .publish-btn:hover {
      background: linear-gradient(135deg, var(--seal-end), var(--primary));
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(143, 168, 120, 0.4);
      transform: translateY(-1px);
    }

    .publish-btn:active { transform: translateY(0) scale(0.97); }

    /* ============================
       LETTER CARDS
    ============================ */
    .letters-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 800px;
      overflow-y: auto;
      padding-right: 4px;
      padding-bottom: 8px;
    }

    .letters-list::-webkit-scrollbar { width: 4px; }
    .letters-list::-webkit-scrollbar-track { background: transparent; }
    .letters-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    .letter-card {
      padding: 20px 24px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 90px;
      overflow: hidden;
    }

    .letter-card:hover {
      max-height: 500px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 30px rgba(51, 66, 47, 0.12);
    }

    .letter-inner {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .letter-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.15rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .letter-avatar.green {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .letter-avatar.grey {
      background: var(--surface-variant);
      color: var(--on-surface-variant);
    }

    .letter-body {
      flex: 1;
      padding-top: 2px;
    }

    .letter-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .letter-title {
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--primary);
      letter-spacing: 0.01em;
    }

    .letter-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .letter-heart-btn {
      background: none;
      border: none;
      color: var(--outline);
      cursor: pointer;
      display: flex;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .letter-card:hover .letter-heart-btn { opacity: 1; }
    .letter-heart-btn:hover { color: var(--primary); transform: scale(1.2); }
    .letter-heart-btn.active { color: var(--primary); opacity: 1; }

    .letter-date {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(166, 138, 82, 0.1);
      color: #785f2c;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 500;
      border: 1px solid rgba(166, 138, 82, 0.2);
      white-space: nowrap;
    }

    .letter-date .material-symbols-outlined {
      font-size: 14px;
    }

    .letter-content {
      font-size: 0.92rem;
      color: var(--on-surface-variant);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .letter-card:hover .letter-content {
      -webkit-line-clamp: unset;
    }

    /* ============================
       FOOTER
    ============================ */
    .page-footer {
      max-width: 1100px;
      margin: 64px auto 0;
      padding: 32px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      opacity: 0.6;
      gap: 16px;
    }

    .footer-brand {
      font-family: 'Fraunces', serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink);
    }

    .footer-copy {
      font-size: 0.82rem;
      color: var(--dusk);
      text-align: center;
    }

    .footer-links {
      display: flex;
      gap: 16px;
    }

    .footer-link {
      font-size: 0.82rem;
      color: var(--on-surface-variant);
      text-decoration: underline;
      text-decoration-color: rgba(64, 104, 60, 0.3);
      transition: opacity 0.2s ease;
    }

    .footer-link:hover { opacity: 0.7; }

    /* ============================
       ANIMATIONS
    ============================ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .page-header  { animation: fadeUp 0.5s ease both; }
    .composer     { animation: fadeUp 0.6s ease 0.1s both; }
    .letters-list { animation: fadeUp 0.6s ease 0.2s both; }

    .letter-card {
      animation: fadeUp 0.4s ease both;
    }

    .letter-card:nth-child(1) { animation-delay: 0.25s; }
    .letter-card:nth-child(2) { animation-delay: 0.35s; }
    .letter-card:nth-child(3) { animation-delay: 0.45s; }

    /* ============================
       RESPONSIVE
    ============================ */
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .page-main { padding: 32px 16px 48px; gap: 28px; }
      .composer { padding: 18px; min-height: 360px; }
      .letter-card { padding: 16px; }
      .letter-date { display: none; }
      .page-footer { flex-direction: column; text-align: center; }
    }
  </style>
</head>

<body>

  <!-- ============================
       TOP NAV BAR
  ============================ -->
  <nav class="top-nav">
    <div class="nav-inner">
      <div class="nav-left">
        <div class="nav-logo"><span>SJ</span></div>
        <div class="nav-title">Our Space</div>
      </div>

      <div class="nav-links">
        <a class="nav-link-inactive" href="main.html">Home</a>
        <a class="nav-link" href="letters.html">Letters</a>
      </div>

      <div>
        <button class="nav-icon-btn" aria-label="Favorites">
          <span class="material-symbols-outlined">favorite</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ============================
       MAIN CONTENT
  ============================ -->
  <main class="page-main">

    <header class="page-header">
      <h1>Our Letters</h1>
      <p>A quiet place for thoughts.</p>
    </header>

    <!-- Composer Section -->
    <div class="glass-panel composer">
      <h2>Write something</h2>
      <form class="composer-form" onsubmit="event.preventDefault();">
        <input class="composer-input" type="text" placeholder="Title" />
        <textarea class="composer-textarea" placeholder="Add letter..."></textarea>
        <div class="composer-footer">
          <button class="composer-heart-btn" type="button">
            <span class="material-symbols-outlined">favorite</span>
          </button>
          <button class="publish-btn" type="submit">Publish</button>
        </div>
      </form>
    </div>

    <!-- Letters List -->
    <div class="letters-list" id="lettersList">
    </div>

  </main>

  <!-- ============================
       FOOTER
  ============================ -->
  <footer class="page-footer">
    <div class="footer-brand">Our Space</div>
    <div class="footer-copy">© 2024 Our Space — Built for us.</div>
    <nav class="footer-links">
      <a class="footer-link" href="#">Privacy</a>
      <a class="footer-link" href="#">Archive</a>
      <a class="footer-link" href="#">Our Story</a>
    </nav>
  </footer>

  <script>
    // Get logged-in user from sessionStorage
    const currentUser = sessionStorage.getItem('currentUser') || 'Eren';

    const form = document.querySelector('.composer-form');
    const titleInput = document.querySelector('.composer-input');
    const textarea = document.querySelector('.composer-textarea');
    const lettersList = document.getElementById('lettersList');

    // Prevent 405 Method Not Allowed by handling form submit via API fetch
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const body = textarea.value.trim();

      if (!title && !body) return;

      const fullText = title ? `**${title}**\n\n${body}` : body;

      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author: currentUser, text: fullText })
        });

        if (res.ok) {
          titleInput.value = '';
          textarea.value = '';
          await loadLetters();
        } else {
          alert('Failed to publish letter.');
        }
      } catch (err) {
        console.error(err);
        alert('Error publishing letter.');
      }
    });

    async function loadLetters() {
      try {
        const res = await fetch('/api/notes');
        if (!res.ok) return;
        const notes = await res.json();
        
        if (!lettersList) return;
        if (notes.length === 0) {
          lettersList.innerHTML = `<p style="text-align:center;opacity:0.6;padding:24px;">No letters yet. Write the first one above! 💌</p>`;
          return;
        }

        lettersList.innerHTML = notes.map(note => {
          const dateStr = new Date(note.created_at || Date.now()).toLocaleDateString('en-US', {
            month: 'short', day: 'numeric', year: 'numeric'
          });
          
          let displayContent = escapeHtml(note.text);
          if (displayContent.startsWith('**') && displayContent.includes('**\n\n')) {
            const parts = displayContent.split('**\n\n');
            const t = parts[0].replace(/\*\*/g, '');
            const b = parts.slice(1).join('**\n\n');
            displayContent = `<h3 style="margin-top:0;margin-bottom:8px;">${t}</h3><p style="white-space:pre-wrap;">${b}</p>`;
          } else {
            displayContent = `<p style="white-space:pre-wrap;">${displayContent}</p>`;
          }

          return `
            <div class="glass-panel letter-card" style="margin-bottom:16px;padding:20px;position:relative;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;opacity:0.7;font-size:0.85rem;">
                <span>From: <strong>${escapeHtml(note.author)}</strong></span>
                <span>${dateStr}</span>
              </div>
              <div>${displayContent}</div>
              <button onclick="deleteLetter('${note.id}')" style="position:absolute;bottom:12px;right:12px;background:none;border:none;color:#e74c3c;cursor:pointer;opacity:0.6;" title="Delete">
                <span class="material-symbols-outlined" style="font-size:18px;">delete</span>
              </button>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('loadLetters error:', err);
      }
    }

    async function deleteLetter(id) {
      if (!confirm('Are you sure you want to delete this letter?')) return;
      try {
        const res = await fetch('/api/notes/' + id, { method: 'DELETE' });
        if (res.ok) await loadLetters();
      } catch (err) {
        console.error(err);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // Load letters on page load
    loadLetters();
  </script>
</body>

</html>
