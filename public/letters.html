<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCode</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="description" content="A quiet place for thoughts, just for the two of you." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <style>
    /* ============================================================
       CLAYMORPHISM DESIGN SYSTEM — OUR LETTERS
    ============================================================ */
    :root {
      --bg-start: #eef0e2;
      --bg-end: #f8f5ec;
      --surface: #f4f1e6;
      --surface-elevated: #fbf9f3;
      --ink: #33422f;
      --dusk: #8a9683;
      --seal-start: #c3d6ac;
      --seal-end: #8fa878;
      --seal: #a9d6a0;
      --gold: #a68a52;
      --line: #dde3cd;
      --primary: #40683c;
      --primary-container: #a9d6a0;
      --on-primary-container: #375e33;
      --surface-variant: #dae6d1;
      --on-surface-variant: #42493f;
      --outline: #72796f;
      --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);

      /* Clay Shadows (Light Mode) */
      --clay-shadow-dark: rgba(120, 140, 100, 0.32);
      --clay-shadow-light: rgba(255, 255, 255, 0.90);
      --clay-inner-dark: rgba(120, 140, 100, 0.18);
      --clay-inner-light: rgba(255, 255, 255, 0.85);

      --btn-clay-shadow:
        6px 8px 18px var(--clay-shadow-dark),
        -4px -4px 12px var(--clay-shadow-light),
        inset 2px 2px 5px var(--clay-inner-light),
        inset -2px -2px 5px var(--clay-inner-dark);
    }

    /* Dark theme overrides */
    [data-theme="dark"] {
      --bg-start: #161a12;
      --bg-end: #1a1e16;
      --surface: #22291d;
      --surface-elevated: #283023;
      --ink: #e8eed8;
      --dusk: #8a9683;
      --seal-start: #4a633e;
      --seal-end: #2d4224;
      --seal: #a9d6a0;
      --gold: #d4b574;
      --line: #2f3a28;
      --primary: #a9d6a0;
      --primary-container: #2e3d2a;
      --on-primary-container: #c5e6bc;
      --surface-variant: #283023;
      --on-surface-variant: #b8c4b2;
      --outline: #5c6656;

      /* Clay Shadows (Dark Mode) */
      --clay-shadow-dark: rgba(0, 0, 0, 0.55);
      --clay-shadow-light: rgba(255, 255, 255, 0.06);
      --clay-inner-dark: rgba(0, 0, 0, 0.38);
      --clay-inner-light: rgba(255, 255, 255, 0.08);

      --btn-clay-shadow:
        6px 8px 18px var(--clay-shadow-dark),
        -4px -4px 12px var(--clay-shadow-light),
        inset 2px 2px 5px var(--clay-inner-light),
        inset -2px -2px 5px var(--clay-inner-dark);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: radial-gradient(ellipse at top, var(--bg-start) 0%, var(--bg-end) 65%);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition), color var(--transition);
    }

    /* ============================================================
       TOP NAV BAR — Clay Floating Header
    ============================================================ */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-radius: 0 0 24px 24px;
      box-shadow:
        0 10px 24px var(--clay-shadow-dark),
        inset 0 4px 10px var(--clay-inner-light),
        inset 0 -6px 14px var(--clay-inner-dark);
      transition: background var(--transition), box-shadow var(--transition);
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Raised circular clay badge */
    .nav-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        6px 6px 14px var(--clay-shadow-dark),
        -4px -4px 10px var(--clay-shadow-light),
        inset -3px -3px 6px var(--clay-inner-dark),
        inset 3px 3px 6px var(--clay-inner-light);
    }

    .nav-logo span {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--ink);
    }

    .nav-title {
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-link,
    .nav-link-inactive {
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 9999px;
      transition: all 0.2s ease;
    }

    .nav-link {
      font-weight: 600;
      background: var(--surface-elevated);
      color: var(--primary);
      box-shadow:
        inset 2px 2px 5px var(--clay-inner-dark),
        inset -2px -2px 5px var(--clay-inner-light);
    }

    .nav-link-inactive {
      font-weight: 500;
      color: var(--on-surface-variant);
    }

    .nav-link-inactive:hover {
      color: var(--primary);
      background: rgba(0, 0, 0, 0.04);
    }

    .nav-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      cursor: pointer;
      box-shadow:
        6px 6px 14px var(--clay-shadow-dark),
        -4px -4px 10px var(--clay-shadow-light),
        inset -3px -3px 6px var(--clay-inner-dark),
        inset 3px 3px 6px var(--clay-inner-light);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-icon-btn:hover {
      transform: translateY(-2px);
    }

    .nav-icon-btn:active {
      transform: scale(0.96);
      box-shadow:
        inset 3px 3px 6px var(--clay-shadow-dark),
        inset -2px -2px 5px var(--clay-shadow-light);
    }

    /* ============================================================
       MAIN CONTENT
    ============================================================ */
    .page-main {
      max-width: 750px;
      margin: 0 auto;
      padding: clamp(24px, 3.5vh, 36px) clamp(14px, 2.5vw, 20px) 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      box-sizing: border-box;
    }

    .page-header h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .page-header p {
      font-size: 0.95rem;
      color: var(--dusk);
    }

    /* ============================================================
       CLAY PANEL (Replaces Glass Panel)
    ============================================================ */
    .glass-panel,
    .clay-panel {
      background: var(--surface);
      border-radius: 28px;
      box-shadow:
        12px 14px 28px var(--clay-shadow-dark),
        -10px -10px 24px var(--clay-shadow-light),
        inset -6px -6px 14px var(--clay-inner-dark),
        inset 6px 6px 14px var(--clay-inner-light);
      border: none;
      transition: background var(--transition), box-shadow var(--transition);
    }

    /* ============================================================
       COMPOSER SECTION
    ============================================================ */
    .composer {
      padding: clamp(20px, 2.8vw, 28px);
      display: flex;
      flex-direction: column;
      min-height: 320px;
      box-sizing: border-box;
    }

    .composer h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .composer-form {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Inset clay input styles */
    .composer-input,
    .composer-textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.03);
      border: none;
      border-radius: 16px;
      padding: 14px 18px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.92rem;
      color: var(--ink);
      outline: none;
      box-shadow:
        inset 3px 3px 7px var(--clay-inner-dark),
        inset -2px -2px 6px var(--clay-inner-light);
      transition: box-shadow 0.2s ease;
    }

    [data-theme="dark"] .composer-input,
    [data-theme="dark"] .composer-textarea {
      background: rgba(0, 0, 0, 0.25);
    }

    .composer-input:focus,
    .composer-textarea:focus {
      box-shadow:
        inset 3px 3px 7px var(--clay-inner-dark),
        inset -2px -2px 6px var(--clay-inner-light),
        0 0 0 2px var(--primary);
    }

    .composer-input {
      margin-bottom: 14px;
    }

    .composer-textarea {
      flex: 1;
      min-height: 160px;
      resize: none;
      margin-bottom: 16px;
    }

    .composer-input::placeholder,
    .composer-textarea::placeholder {
      color: var(--outline);
    }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .composer-heart-btn {
      background: var(--surface-elevated);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        4px 4px 10px var(--clay-shadow-dark),
        -3px -3px 8px var(--clay-shadow-light),
        inset -2px -2px 4px var(--clay-inner-dark),
        inset 2px 2px 4px var(--clay-inner-light);
      transition: transform 0.2s ease;
    }

    .composer-heart-btn:hover {
      transform: scale(1.1);
    }

    /* Raised clay pill publish button */
    .publish-btn {
      background: linear-gradient(135deg, var(--seal-start), var(--seal-end));
      color: #1e3019;
      border: none;
      border-radius: 9999px;
      padding: 12px 32px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.90rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--btn-clay-shadow);
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .publish-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        8px 10px 22px var(--clay-shadow-dark),
        -5px -5px 14px var(--clay-shadow-light),
        inset 2px 2px 5px var(--clay-inner-light),
        inset -2px -2px 5px var(--clay-inner-dark);
    }

    .publish-btn:active {
      transform: scale(0.97);
      box-shadow:
        inset 4px 4px 10px var(--clay-shadow-dark),
        inset -3px -3px 8px var(--clay-shadow-light);
    }

    [data-theme="dark"] .publish-btn {
      background: linear-gradient(135deg, #40683c, #2a4727);
      color: #e8eed8;
    }

    /* ============================================================
       LETTER CARDS (Clay Cards)
    ============================================================ */
    .letters-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 800px;
      overflow-y: auto;
      padding: 6px 4px 12px;
    }

    .letters-list::-webkit-scrollbar { width: 5px; }
    .letters-list::-webkit-scrollbar-track { background: transparent; }
    .letters-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

    .letter-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 22px 24px;
      cursor: pointer;
      box-shadow:
        10px 12px 24px var(--clay-shadow-dark),
        -8px -8px 20px var(--clay-shadow-light),
        inset -4px -4px 10px var(--clay-inner-dark),
        inset 4px 4px 10px var(--clay-inner-light);
      border: none;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1), background var(--transition);
      position: relative;
    }

    .letter-card:hover {
      transform: translateY(-3px);
      box-shadow:
        14px 16px 30px var(--clay-shadow-dark),
        -10px -10px 24px var(--clay-shadow-light),
        inset -4px -4px 10px var(--clay-inner-dark),
        inset 4px 4px 10px var(--clay-inner-light);
    }

    /* ============================================================
       FOOTER
    ============================================================ */
    .page-footer {
      max-width: 1100px;
      margin: 64px auto 0;
      padding: 32px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      opacity: 0.75;
      gap: 16px;
    }

    .footer-brand {
      font-family: 'Fraunces', serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink);
    }

    .footer-copy {
      font-size: 0.84rem;
      color: var(--dusk);
      text-align: center;
    }

    .footer-links {
      display: flex;
      gap: 16px;
    }

    .footer-link {
      font-size: 0.84rem;
      color: var(--on-surface-variant);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-link:hover { color: var(--primary); }

    /* ============================================================
       ANIMATIONS & RESPONSIVE
    ============================================================ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .page-header  { animation: fadeUp 0.5s ease both; }
    .composer     { animation: fadeUp 0.6s ease 0.1s both; }
    .letters-list { animation: fadeUp 0.6s ease 0.2s both; }

    @media (max-width: 640px) {
      .nav-links { display: none; }
      .page-main { padding: 20px 14px 36px; gap: 20px; }
      .composer { padding: 18px; min-height: 280px; }
      .letter-card { padding: 16px; border-radius: 20px; }
      .page-footer { flex-direction: column; text-align: center; }
    }
  </style>
</head>

<body>

  <!-- ============================
       TOP NAV BAR
  ============================ -->
  <nav class="top-nav">
    <div class="nav-inner">
      <div class="nav-left">
        <div class="nav-logo"><span>SJ</span></div>
        <div class="nav-title">Our Space</div>
      </div>

      <div class="nav-links">
        <a class="nav-link-inactive" href="main.html">Home</a>
        <a class="nav-link" href="letters.html">Letters</a>
      </div>

      <div>
        <button class="nav-icon-btn" aria-label="Favorites">
          <span class="material-symbols-outlined">favorite</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ============================
       MAIN CONTENT
  ============================ -->
  <main class="page-main">

    <header class="page-header">
      <h1>Our Letters</h1>
      <p>A quiet place for thoughts.</p>
    </header>

    <!-- Composer Section -->
    <div class="glass-panel composer">
      <h2>Write something</h2>
      <form class="composer-form" onsubmit="event.preventDefault();">
        <input class="composer-input" type="text" placeholder="Title" />
        <textarea class="composer-textarea" placeholder="Add letter..."></textarea>
        <div class="composer-footer">
          <button class="composer-heart-btn" type="button">
            <span class="material-symbols-outlined">favorite</span>
          </button>
          <button class="publish-btn" type="submit">Publish</button>
        </div>
      </form>
    </div>

    <!-- Letters List -->
    <div class="letters-list" id="lettersList">
    </div>

  </main>

  <!-- ============================
       FOOTER
  ============================ -->
  <footer class="page-footer">
    <div class="footer-brand">Our Space</div>
    <div class="footer-copy">© 2024 Our Space — Built for us.</div>
    <nav class="footer-links">
      <a class="footer-link" href="#">Privacy</a>
      <a class="footer-link" href="#">Archive</a>
      <a class="footer-link" href="#">Our Story</a>
    </nav>
  </footer>

  <script>
    // Get logged-in user from sessionStorage
    const currentUser = sessionStorage.getItem('currentUser') || 'Eren';

    const form = document.querySelector('.composer-form');
    const titleInput = document.querySelector('.composer-input');
    const textarea = document.querySelector('.composer-textarea');
    const lettersList = document.getElementById('lettersList');

    // Prevent 405 Method Not Allowed by handling form submit via API fetch
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const body = textarea.value.trim();

      if (!title && !body) return;

      const fullText = title ? `**${title}**\n\n${body}` : body;

      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author: currentUser, text: fullText })
        });

        if (res.ok) {
          titleInput.value = '';
          textarea.value = '';
          await loadLetters();
        } else {
          alert('Failed to publish letter.');
        }
      } catch (err) {
        console.error(err);
        alert('Error publishing letter.');
      }
    });

    async function loadLetters() {
      try {
        const res = await fetch('/api/notes');
        if (!res.ok) return;
        const notes = await res.json();
        
        if (!lettersList) return;
        if (notes.length === 0) {
          lettersList.innerHTML = `<p style="text-align:center;opacity:0.6;padding:24px;">No letters yet. Write the first one above!</p>`;
          return;
        }

        lettersList.innerHTML = notes.map(note => {
          const dateStr = new Date(note.created_at || Date.now()).toLocaleDateString('en-US', {
            month: 'short', day: 'numeric', year: 'numeric'
          });
          
          let displayContent = escapeHtml(note.text);
          if (displayContent.startsWith('**') && displayContent.includes('**\n\n')) {
            const parts = displayContent.split('**\n\n');
            const t = parts[0].replace(/\*\*/g, '');
            const b = parts.slice(1).join('**\n\n');
            displayContent = `<h3 style="margin-top:0;margin-bottom:8px;">${t}</h3><p style="white-space:pre-wrap;">${b}</p>`;
          } else {
            displayContent = `<p style="white-space:pre-wrap;">${displayContent}</p>`;
          }

          return `
            <div class="glass-panel letter-card" style="margin-bottom:16px;padding:20px;position:relative;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;opacity:0.7;font-size:0.85rem;">
                <span>From: <strong>${escapeHtml(note.author)}</strong></span>
                <span>${dateStr}</span>
              </div>
              <div>${displayContent}</div>
              <button onclick="deleteLetter('${note.id}')" style="position:absolute;bottom:12px;right:12px;background:none;border:none;color:#e74c3c;cursor:pointer;opacity:0.6;" title="Delete">
                <span class="material-symbols-outlined" style="font-size:18px;">delete</span>
              </button>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('loadLetters error:', err);
      }
    }

    async function deleteLetter(id) {
      if (!confirm('Are you sure you want to delete this letter?')) return;
      try {
        const res = await fetch('/api/notes/' + id, { method: 'DELETE' });
        if (res.ok) await loadLetters();
      } catch (err) {
        console.error(err);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // Load letters on page load and auto-refresh every 5 seconds for real-time sharing across devices
    loadLetters();
    setInterval(loadLetters, 5000);
  
    // Apply saved or default dark theme
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>

</html>
