<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --leetcode-bg: #f7f9fa;
            --leetcode-card-bg: #ffffff;
            --leetcode-orange: #FFA116;
            --leetcode-dark: #262626;
            --leetcode-btn: #3f4d58;
            --leetcode-btn-hover: #2d3840;
            --leetcode-border: #dcdcdc;
            --leetcode-muted: #8c8c8c;
            --leetcode-text: #262626;

            /* Legacy variable mapping for app view fallback */
            --bg: #f7f9fa;
            --surface: #ffffff;
            --ink: #262626;
            --dusk: #8c8c8c;
            --seal: #3f4d58;
            --seal-start: #3f4d58;
            --seal-end: #2d3840;
            --gold: #FFA116;
            --line: #dcdcdc;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f0f2f5;
            color: var(--leetcode-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* LeetCode Top Navigation Bar */
        .leetcode-nav {
            height: 52px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            font-size: 14px;
        }

        .leetcode-nav-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .leetcode-logo-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .leetcode-nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .leetcode-nav-links a {
            color: #595959;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.15s;
        }

        .leetcode-nav-links a:hover {
            color: #262626;
        }

        .leetcode-nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .leetcode-search {
            background: #f2f3f5;
            border-radius: 16px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8c8c8c;
            font-size: 13px;
            width: 180px;
        }

        .leetcode-icon-btn {
            background: none;
            border: none;
            color: #595959;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .leetcode-premium-btn {
            background: #fff3e0;
            color: #f89f1b;
            border: none;
            border-radius: 14px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Main Container */
        .login-page-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .leetcode-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 40px 36px 32px;
            text-align: center;
        }

        .leetcode-logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }

        .leetcode-brand-name {
            font-size: 22px;
            font-weight: 700;
            color: #262626;
            margin-top: 10px;
            letter-spacing: -0.3px;
        }

        .leetcode-input {
            width: 100%;
            height: 44px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            padding: 0 14px;
            font-size: 14px;
            color: #262626;
            outline: none;
            margin-bottom: 16px;
            transition: border-color 0.15s;
            box-sizing: border-box;
            background: #ffffff;
        }

        .leetcode-input:focus {
            border-color: #262626;
        }

        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: left;
        }

        .captcha-box {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #fafafa;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .captcha-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .captcha-check {
            width: 22px;
            height: 22px;
            background: #34a853;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
        }

        .captcha-text {
            font-size: 14px;
            font-weight: 500;
            color: #333333;
        }

        .cloudflare-logo {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 9px;
            color: #8c8c8c;
            line-height: 1.2;
        }

        .leetcode-submit-btn {
            width: 100%;
            height: 44px;
            background: #3f4d58;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .leetcode-submit-btn:hover {
            background: #2d3840;
        }

        .leetcode-submit-btn:disabled {
            opacity: 0.7;
            cursor: default;
        }

        .leetcode-card-links {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 13px;
        }

        .leetcode-card-links a {
            color: #777777;
            text-decoration: none;
        }

        .leetcode-card-links a:hover {
            color: #262626;
        }

        .social-divider {
            margin-top: 24px;
            font-size: 12px;
            color: #a0a0a0;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
        }

        .social-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666666;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .social-icon-btn:hover {
            background: #d8d8d8;
        }

        .switch {
            text-align: center;
            margin-top: 22px;
            font-size: 0.85rem;
            color: var(--dusk);
        }

        .switch button {
            background: none;
            border: none;
            color: var(--gold);
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
            padding: 0;
            font-family: inherit;
        }

        .welcome {
            text-align: center;
        }

        .welcome h1 {
            margin-bottom: 4px;
        }

        .welcome p {
            color: var(--dusk);
            font-size: 0.9rem;
        }

        .logout {
            margin-top: 24px;
            background: none;
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 10px 18px;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.85rem;
        }

        /* ---- Notes area (step 2) ---- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .top-bar h1 {
            text-align: left;
            margin: 0;
            font-size: 1.3rem;
        }

        .signed-in-as {
            color: var(--dusk);
            font-size: 0.78rem;
            margin-top: 2px;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 11px 12px;
            color: var(--ink);
            font-family: 'Work Sans', sans-serif;
            font-size: 0.92rem;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--gold);
        }

        .add-btn {
            margin-top: 10px;
            background: var(--seal);
            color: #24331f;
            border: none;
            padding: 10px 16px;
            border-radius: 14px;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }

        .add-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .notes-list {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
        }

        .note-item {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 12px 14px;
            position: relative;
        }

        .note-text {
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0 0 8px;
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--dusk);
            font-size: 0.72rem;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #b2503f;
            cursor: pointer;
            font-size: 0.72rem;
            padding: 0;
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            color: var(--dusk);
            font-size: 0.85rem;
            padding: 20px 0;
        }

        /* ---- App frame: header 30% / main 60% (step 3) ---- */
        .app-frame {
            display: flex;
            flex-direction: column;
            height: 78vh;
        }

        .app-header {
            min-height: 30%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-bottom: 1px solid var(--line);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .app-main {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--line);
            color: var(--dusk);
            padding: 7px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: 'Work Sans', sans-serif;
        }

        .tab-btn.active {
            background: var(--seal);
            color: #24331f;
            border-color: var(--seal);
        }

        .msg-item {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .msg-author {
            font-size: 0.78rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .msg-text {
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0 0 8px;
        }

        .msg-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .msg-expiry {
            color: var(--dusk);
            font-size: 0.7rem;
        }

        .msg-actions {
            display: flex;
            gap: 12px;
        }

        .alter-btn {
            background: none;
            border: none;
            color: var(--gold);
            cursor: pointer;
            font-size: 0.72rem;
            padding: 0;
            text-decoration: underline;
        }

        /* Star / like button on messages */
        .like-btn {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: transform 0.15s ease;
        }

        .like-btn:hover {
            transform: scale(1.25);
        }

        .like-btn:active {
            transform: scale(0.9);
        }

        .composer {
            margin-top: 12px;
            flex-shrink: 0;
        }

        .save-btn {
            margin-top: 8px;
            background: var(--seal);
            color: #24331f;
            border: none;
            padding: 10px 16px;
            border-radius: 14px;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }

        .editing-banner {
            font-size: 0.75rem;
            color: var(--gold);
            margin-top: 6px;
        }
    </style>
</head>

<body>

    <!-- LeetCode Header Navigation -->
    <nav class="leetcode-nav">
        <div class="leetcode-nav-left">
            <div class="leetcode-logo-nav">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M16.102 17.93l-2.697 2.607c-.466.467-1.111.662-1.823.662s-1.357-.195-1.824-.662l-4.332-4.363c-.467-.467-.702-1.15-.702-1.863 0-.713.235-1.357.702-1.824l4.319-4.38c.467-.467 1.125-.645 1.837-.645s1.357.195 1.824.662l2.697 2.606c.514.515 1.365.497 1.9-.038.535-.536.553-1.387.039-1.901l-2.606-2.636a4.994 4.994 0 00-3.855-1.42 5.01 5.01 0 00-3.855 1.42L3.398 12.08a5.006 5.006 0 000 7.086l4.332 4.363a4.995 4.995 0 003.553 1.47 5.011 5.011 0 003.553-1.47l2.697-2.607c.514-.514.496-1.365-.039-1.901-.535-.535-1.386-.552-1.9-.038z" fill="#FFA116"/>
                    <path d="M10.74 9.64l4.319-4.38a4.994 4.994 0 013.553-1.42 5.01 5.01 0 013.553 1.42l.5.5c.515.515.497 1.366-.038 1.901-.536.536-1.387.553-1.902.039l-.5-.5a2.505 2.505 0 00-1.824-.662 2.497 2.497 0 00-1.824.662l-4.319 4.38a1.356 1.356 0 000 1.902c.515.514 1.366.496 1.902-.039z" fill="#262626"/>
                </svg>
            </div>
            <div class="leetcode-nav-links">
                <a href="#">Explore</a>
                <a href="#">Problems</a>
                <a href="#">Contest</a>
                <a href="#">Discuss</a>
                <a href="#">Interview ▾</a>
                <a href="#" style="color:#FFA116;">Store ▾</a>
            </div>
        </div>
        <div class="leetcode-nav-right">
            <div class="leetcode-search">
                🔍 Search
            </div>
            <button class="leetcode-icon-btn">🔔</button>
            <button class="leetcode-icon-btn">🔥 0</button>
            <button class="leetcode-premium-btn">Premium</button>
        </div>
    </nav>

    <!-- Center Login Card -->
    <div class="login-page-container">
        <div class="leetcode-card" id="card">
            <!-- content injected by JS -->
        </div>
    </div>

    <script>
        // ---- App state ----
        let currentUser = null;
        let loading = false;
        let errorMsg = '';

        // ---- Notes state (step 2) ----
        let notes = [];          // array of { id, text, author, createdAt }
        let notesLoaded = false; // have we fetched from storage yet?
        let notesError = '';

        // ---- Messages state (step 3) ----
        let activeTab = 'home'; // 'home' | 'notes' | 'messages' | 'photos' | 'settings' | 'reminders'
        let messages = [];        // array of { id, author, text, createdAt, expiresAt }
        let messagesLoaded = false;
        let messagesError = '';
        let editingMessageId = null; // if set, Save will UPDATE this message instead of creating a new one

        const card = document.getElementById('card');

        // ---- Rendering ----
        function render() {
            if (currentUser) {
                renderApp();
                return;
            }

            card.innerHTML = `
                <div class="leetcode-logo-center">
                    <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
                        <path d="M16.102 17.93l-2.697 2.607c-.466.467-1.111.662-1.823.662s-1.357-.195-1.824-.662l-4.332-4.363c-.467-.467-.702-1.15-.702-1.863 0-.713.235-1.357.702-1.824l4.319-4.38c.467-.467 1.125-.645 1.837-.645s1.357.195 1.824.662l2.697 2.606c.514.515 1.365.497 1.9-.038.535-.536.553-1.387.039-1.901l-2.606-2.636a4.994 4.994 0 00-3.855-1.42 5.01 5.01 0 00-3.855 1.42L3.398 12.08a5.006 5.006 0 000 7.086l4.332 4.363a4.995 4.995 0 003.553 1.47 5.011 5.011 0 003.553-1.47l2.697-2.607c.514-.514.496-1.365-.039-1.901-.535-.535-1.386-.552-1.9-.038z" fill="#FFA116"/>
                        <path d="M10.74 9.64l4.319-4.38a4.994 4.994 0 013.553-1.42 5.01 5.01 0 013.553 1.42l.5.5c.515.515.497 1.366-.038 1.901-.536.536-1.387.553-1.902.039l-.5-.5a2.505 2.505 0 00-1.824-.662 2.497 2.497 0 00-1.824.662l-4.319 4.38a1.356 1.356 0 000 1.902c.515.514 1.366.496 1.902-.039z" fill="#262626"/>
                    </svg>
                    <div class="leetcode-brand-name">LeetCode</div>
                </div>

                <input class="leetcode-input" id="username" type="text" placeholder="Username or E-mail" autocomplete="off" />
                <input class="leetcode-input" id="password" type="password" placeholder="Password" autocomplete="off" />

                ${errorMsg ? `<div class="error" id="errorMsg">${escapeHtml(errorMsg)}</div>` : ''}

                <div class="captcha-box">
                    <div class="captcha-left">
                        <div class="captcha-check">✓</div>
                        <span class="captcha-text">Success!</span>
                    </div>
                    <div class="cloudflare-logo">
                        <span style="font-weight:700;color:#f38020;">CLOUDFLARE</span>
                        <span>Privacy • Terms</span>
                    </div>
                </div>

                <button class="leetcode-submit-btn" id="submitBtn" ${loading ? 'disabled' : ''}>
                    ${loading ? 'Signing In...' : 'Sign In'}
                </button>

                <div class="leetcode-card-links">
                    <a href="#">Forgot Password?</a>
                    <a href="#">Sign Up</a>
                </div>

                <div class="social-divider">or you can sign in with</div>

                <div class="social-icons">
                    <div class="social-icon-btn">G</div>
                    <div class="social-icon-btn">🐱</div>
                    <div class="social-icon-btn">f</div>
                    <div class="social-icon-btn">...</div>
                </div>
            `;

            document.getElementById('submitBtn').onclick = handleSubmit;

            // allow Enter key to submit
            card.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('keydown', e => {
                    if (e.key === 'Enter') handleSubmit();
                });
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ---- Password hashing ----
        // No longer needed on the client — the server hashes and compares.
        // Removed: hashPassword(), getUsers(), saveUsers()

        // ---- Submit handler ----
        // Calls the backend API instead of checking localStorage
        async function handleSubmit() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            errorMsg = '';

            if (!username || !password) {
                errorMsg = 'Please fill in both fields.';
                render();
                return;
            }

            loading = true;
            render();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    errorMsg = data.error || 'Name or password is incorrect.';
                } else {
                    currentUser = data.username;
                    sessionStorage.setItem('currentUser', data.username);
                    window.location.href = 'main.html';
                    return; // stop further execution
                }
            } catch (e) {
                errorMsg = 'Something went wrong. Please try again.';
                console.error(e);
            }

            loading = false;
            render();
        }


        // ==== NOTES (step 2) ====
        // Now backed by the Supabase API instead of localStorage.

        async function loadNotes() {
            try {
                const res = await fetch('/api/notes');
                if (!res.ok) throw new Error('Failed to load notes');
                notes = await res.json();
                // Map Supabase column names to the ones our UI expects
                notes = notes.map(n => ({
                    id: String(n.id),
                    text: n.text,
                    author: n.author,
                    createdAt: n.created_at
                }));
            } catch (e) {
                console.error('loadNotes:', e);
                notes = [];
            }
            notesLoaded = true;
        }

        async function addNote(text) {
            const res = await fetch('/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author: currentUser, text })
            });
            if (!res.ok) throw new Error('Failed to add note');
            // Reload from server to stay in sync
            await loadNotes();
        }

        async function deleteNote(id) {
            const res = await fetch(`/api/notes/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Failed to delete note');
            await loadNotes();
        }


        function formatWhen(iso) {
            const d = new Date(iso);
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
                ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        }

        // ==== APP FRAME (step 3): header 30% / main 60%, with tabs ====

        const TAB_LABELS = { home: 'Home', notes: 'Notes', messages: 'Messages', photos: 'Photos', settings: 'Settings', reminders: 'Reminders' };

        async function renderApp() {
            // Fetch data lazily, once, the first time each tab is needed
            if (!notesLoaded) await loadNotes();
            if (!messagesLoaded) await loadMessages();

            card.innerHTML = `
      <div class="app-frame">
        <div class="app-header">
          <div class="top-bar">
            <div>
              <h1>Our Space</h1>
              <div class="signed-in-as">Signed in as ${escapeHtml(currentUser)}</div>
            </div>
            <button class="logout" id="logoutBtn">Log out</button>
          </div>
          <div class="tabs">
            ${Object.keys(TAB_LABELS).map(key => `
              <button class="tab-btn ${activeTab === key ? 'active' : ''}" data-tab="${key}">${TAB_LABELS[key]}</button>
            `).join('')}
          </div>
        </div>

        <div class="app-main" id="appMain">
          ${contentForActiveTab()}
        </div>
      </div>
    `;

            document.getElementById('logoutBtn').onclick = () => {
                currentUser = null;
                render();
            };
            document.querySelectorAll('[data-tab]').forEach(btn => {
                btn.onclick = () => { activeTab = btn.dataset.tab; renderApp(); };
            });
            document.querySelectorAll('[data-goto]').forEach(btn => {
                btn.onclick = () => { activeTab = btn.dataset.goto; renderApp(); };
            });

            if (activeTab === 'notes') wireNotesTab();
            else if (activeTab === 'messages') wireMessagesTab();
        }

        function contentForActiveTab() {
            switch (activeTab) {
                case 'home': return homeTabHtml();
                case 'notes': return notesTabHtml();
                case 'messages': return messagesTabHtml();
                default: return stubTabHtml(TAB_LABELS[activeTab]);
            }
        }

        // ---- Home page: greeting, quick overview, navigation ----
        function greetingForNow() {
            const h = new Date().getHours();
            if (h < 12) return 'Good morning';
            if (h < 18) return 'Good afternoon';
            return 'Good evening';
        }

        function homeTabHtml() {
            const activeMessages = messages.filter(m => new Date(m.expiresAt) > new Date());
            const navItems = [
                { key: 'notes', label: 'Notes', desc: notes.length + ' saved' },
                { key: 'messages', label: 'Messages', desc: activeMessages.length + ' active' },
                { key: 'photos', label: 'Photos', desc: 'coming soon' },
                { key: 'settings', label: 'Settings', desc: 'coming soon' },
                { key: 'reminders', label: 'Reminders', desc: 'coming soon' }
            ];
            return `
      <h1 style="font-size:1.2rem;text-align:left;margin-bottom:2px;">${greetingForNow()}, ${escapeHtml(currentUser)}</h1>
      <p style="color:var(--dusk);font-size:0.85rem;margin-top:0;">Here's your space.</p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;">
        ${navItems.map(item => `
          <button data-goto="${item.key}" style="text-align:left;cursor:pointer;background:rgba(255,255,255,0.55);border:1px solid var(--line, #dbe4c9);border-radius:8px;padding:14px;font-family:'Work Sans',sans-serif;">
            <div style="font-weight:600;font-size:0.92rem;color:var(--ink);">${item.label}</div>
            <div style="font-size:0.75rem;color:var(--dusk);margin-top:3px;">${item.desc}</div>
          </button>
        `).join('')}
      </div>
    `;
        }

        function stubTabHtml(label) {
            return `
      <div class="empty-state" style="padding:40px 0;">
        <div style="font-family:'Fraunces',serif;font-size:1.1rem;color:var(--ink);margin-bottom:6px;">${escapeHtml(label)}</div>
        We'll build this together soon.
      </div>
    `;
        }

        // ---- Notes tab (same behavior as step 2, just reused inside the frame) ----
        function notesTabHtml() {
            return `
      <textarea id="noteInput" placeholder="Write something for the two of you..."></textarea>
      <button class="add-btn" id="addBtn">Save note</button>
      <div class="error" id="notesError">${notesError}</div>

      <div class="notes-list" id="notesList">
        ${notes.length === 0
                    ? `<div class="empty-state">Nothing saved yet — write your first note above.</div>`
                    : notes.map(n => `
              <div class="note-item">
                <p class="note-text">${escapeHtml(n.text)}</p>
                <div class="note-meta">
                  <span>${escapeHtml(n.author)} · ${formatWhen(n.createdAt)}</span>
                  <button class="delete-btn" data-id="${n.id}">delete</button>
                </div>
              </div>
            `).join('')}
      </div>
    `;
        }

        function wireNotesTab() {
            document.getElementById('addBtn').onclick = async () => {
                const input = document.getElementById('noteInput');
                const text = input.value.trim();
                if (!text) return;

                document.getElementById('addBtn').disabled = true;
                try {
                    await addNote(text);
                    notesError = '';
                    renderApp();
                } catch (e) {
                    notesError = 'Could not save — please try again.';
                    renderApp();
                }
            };

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = async () => {
                    await deleteNote(btn.dataset.id);
                    renderApp();
                };
            });
        }

        // ---- Messages tab (step 3) ----
        const WEEK_MS = 7 * 24 * 60 * 60 * 1000; // one week, in milliseconds

        // ---- Starred helpers (shared with main.html via localStorage) ----
        function getStarredItems() {
            try { return JSON.parse(localStorage.getItem('starredItems') || '[]'); } catch { return []; }
        }

        function saveStarredItems(arr) {
            localStorage.setItem('starredItems', JSON.stringify(arr));
        }

        function isLiked(messageId) {
            return getStarredItems().some(s => s.messageId === messageId);
        }

        function toggleLike(msg) {
            let arr = getStarredItems();
            const idx = arr.findIndex(s => s.messageId === msg.id);
            if (idx !== -1) {
                arr.splice(idx, 1); // un-like
            } else {
                arr.unshift({
                    messageId: msg.id,
                    text: msg.text,
                    author: msg.author,
                    likedAt: new Date().toISOString()
                });
            }
            saveStarredItems(arr);
        }

        function messagesTabHtml() {
            const visible = messages.filter(m => new Date(m.expiresAt) > new Date());
            return `
      <textarea id="msgInput" placeholder="Write a private message...">${editingMessageId ? escapeHtml(messages.find(m => m.id === editingMessageId)?.text || '') : ''}</textarea>
      ${editingMessageId ? `<div class="editing-banner">Editing a message — Save to update it.</div>` : ''}
      <button class="save-btn" id="saveMsgBtn">${editingMessageId ? 'Update message' : 'Save message'}</button>
      <div class="error" id="messagesError">${messagesError}</div>

      <div class="notes-list" id="messagesList">
        ${visible.length === 0
                    ? `<div class="empty-state">No messages yet — write one above.</div>`
                    : visible.map(m => `
              <div class="msg-item">
                <div class="msg-author">${escapeHtml(m.author)}</div>
                <p class="msg-text">${escapeHtml(m.text)}</p>
                <div class="msg-footer">
                  <span class="msg-expiry">expires ${formatWhen(m.expiresAt)}</span>
                  <div class="msg-actions">
                    <button class="like-btn" data-id="${m.id}" data-action="like"
                      title="${isLiked(m.id) ? 'Remove from favourites' : 'Add to favourites'}">
                      ${isLiked(m.id) ? '⭐' : '☆'}
                    </button>
                    <button class="alter-btn" data-id="${m.id}" data-action="alter">alter</button>
                    <button class="delete-btn" data-id="${m.id}" data-action="delete">delete</button>
                  </div>
                </div>
              </div>
            `).join('')}
      </div>
    `;
        }

        function wireMessagesTab() {
            document.getElementById('saveMsgBtn').onclick = async () => {
                const input = document.getElementById('msgInput');
                const text = input.value.trim();
                if (!text) return;

                document.getElementById('saveMsgBtn').disabled = true;
                try {
                    if (editingMessageId) {
                        await updateMessage(editingMessageId, text);
                        editingMessageId = null;
                    } else {
                        await publishMessage(text);
                    }
                    messagesError = '';
                    renderApp();
                } catch (e) {
                    messagesError = 'Could not save — please try again.';
                    renderApp();
                }
            };

            // ⭐ Like / unlike — saves to starredItems for main.html
            document.querySelectorAll('[data-action="like"]').forEach(btn => {
                btn.onclick = () => {
                    const msg = messages.find(m => m.id === btn.dataset.id);
                    if (!msg) return;
                    toggleLike(msg);
                    // Re-render just this button to give instant feedback
                    const liked = isLiked(msg.id);
                    btn.textContent = liked ? '⭐' : '☆';
                    btn.title = liked ? 'Remove from favourites' : 'Add to favourites';
                };
            });

            document.querySelectorAll('[data-action="alter"]').forEach(btn => {
                btn.onclick = () => {
                    editingMessageId = btn.dataset.id;
                    renderApp();
                };
            });

            document.querySelectorAll('[data-action="delete"]').forEach(btn => {
                btn.onclick = async () => {
                    await deleteMessage(btn.dataset.id);
                    renderApp();
                };
            });
        }

        // Now backed by the Supabase API instead of localStorage.
        async function loadMessages() {
            try {
                const res = await fetch('/api/messages');
                if (!res.ok) throw new Error('Failed to load messages');
                messages = await res.json();
                // Map Supabase column names to the ones our UI expects
                messages = messages.map(m => ({
                    id: String(m.id),
                    author: m.author,
                    text: m.text,
                    createdAt: m.created_at,
                    expiresAt: m.expires_at
                }));
            } catch (e) {
                console.error('loadMessages:', e);
                messages = [];
            }
            messagesLoaded = true;
        }

        async function publishMessage(text) {
            const res = await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author: currentUser, text })
            });
            if (!res.ok) throw new Error('Failed to create message');
            await loadMessages();
        }

        async function updateMessage(id, text) {
            const res = await fetch(`/api/messages/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            if (!res.ok) throw new Error('Failed to update message');
            await loadMessages();
        }

        async function deleteMessage(id) {
            const res = await fetch(`/api/messages/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Failed to delete message');
            await loadMessages();
        }

        // ---- Startup ----
        // Seeding is handled by the server on startup, so we just render.
        render();

    </script>

</body>

</html>
