<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --leetcode-bg: #f5f7f2;
            --leetcode-card-bg: #fbf9f5;
            --leetcode-orange: #FFA116;
            --leetcode-dark: #262626;
            --leetcode-btn: #3f4d58;
            --leetcode-btn-hover: #2d3840;
            --leetcode-border: #dde3cd;
            --leetcode-muted: #8a9683;
            --leetcode-text: #33422f;

            --bg: #f5f7f2;
            --surface: #fbf9f5;
            --ink: #33422f;
            --dusk: #8a9683;
            --seal: #3f4d58;
            --seal-start: #3f4d58;
            --seal-end: #2d3840;
            --gold: #FFA116;
            --line: #dde3cd;
            --card-bg: #fbf9f5;

            /* Claymorphism Shadow Tokens (Light Mode) */
            --clay-shadow-dark: rgba(120, 140, 100, 0.28);
            --clay-shadow-light: rgba(255, 255, 255, 0.95);
            --clay-inner-dark: rgba(120, 140, 100, 0.16);
            --clay-inner-light: rgba(255, 255, 255, 0.85);

            --btn-clay-shadow:
                6px 8px 18px var(--clay-shadow-dark),
                -4px -4px 12px var(--clay-shadow-light),
                inset 2px 2px 5px var(--clay-inner-light),
                inset -2px -2px 5px var(--clay-inner-dark);
        }

        [data-theme="dark"] {
            --leetcode-bg: #161a12;
            --leetcode-card-bg: #22291d;
            --leetcode-orange: #FFA116;
            --leetcode-dark: #eff1f6;
            --leetcode-btn: #3e4852;
            --leetcode-btn-hover: #4e5b67;
            --leetcode-border: #2f3a28;
            --leetcode-muted: #8a9683;
            --leetcode-text: #e8eed8;

            --bg: #161a12;
            --surface: #22291d;
            --ink: #e8eed8;
            --dusk: #8a9683;
            --seal: #FFA116;
            --seal-start: #3e4852;
            --seal-end: #2d3840;
            --gold: #FFA116;
            --line: #2f3a28;
            --card-bg: #22291d;

            /* Claymorphism Shadow Tokens (Dark Mode) */
            --clay-shadow-dark: rgba(0, 0, 0, 0.60);
            --clay-shadow-light: rgba(255, 255, 255, 0.06);
            --clay-inner-dark: rgba(0, 0, 0, 0.40);
            --clay-inner-light: rgba(255, 255, 255, 0.08);

            --btn-clay-shadow:
                6px 8px 18px var(--clay-shadow-dark),
                -4px -4px 12px var(--clay-shadow-light),
                inset 2px 2px 5px var(--clay-inner-light),
                inset -2px -2px 5px var(--clay-inner-dark);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at top, var(--bg) 0%, #e8ede0 70%);
            color: var(--leetcode-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
        }

        [data-theme="dark"] body {
            background: radial-gradient(ellipse at top, #161a12 0%, #1a1e16 70%);
        }

        /* ============================================================
           CLAY TOP NAVIGATION BAR
        ============================================================ */
        .leetcode-nav {
            height: 56px;
            background: var(--leetcode-card-bg);
            border-radius: 0 0 24px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            font-size: 14px;
            box-shadow:
                0 10px 24px var(--clay-shadow-dark),
                inset 0 4px 10px var(--clay-inner-light),
                inset 0 -6px 14px var(--clay-inner-dark);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .leetcode-nav-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .leetcode-logo-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .leetcode-nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .leetcode-nav-links a {
            color: var(--leetcode-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.15s;
        }

        .leetcode-nav-links a:hover {
            color: var(--leetcode-text);
        }

        .leetcode-nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Inset clay search input */
        .leetcode-search {
            background: rgba(0, 0, 0, 0.04);
            border-radius: 9999px;
            padding: 7px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--leetcode-muted);
            font-size: 13px;
            width: 180px;
            box-shadow:
                inset 2px 2px 5px var(--clay-inner-dark),
                inset -2px -2px 5px var(--clay-inner-light);
        }

        [data-theme="dark"] .leetcode-search {
            background: rgba(0, 0, 0, 0.25);
        }

        /* Raised circular clay icon buttons */
        .leetcode-icon-btn {
            background: var(--leetcode-card-bg);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            color: var(--leetcode-muted);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                4px 4px 10px var(--clay-shadow-dark),
                -3px -3px 8px var(--clay-shadow-light),
                inset -2px -2px 4px var(--clay-inner-dark),
                inset 2px 2px 4px var(--clay-inner-light);
            transition: transform 0.15s ease;
        }

        .leetcode-icon-btn:active {
            transform: scale(0.95);
            box-shadow:
                inset 2px 2px 5px var(--clay-shadow-dark),
                inset -1px -1px 3px var(--clay-shadow-light);
        }

        .leetcode-premium-btn {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            color: #f89f1b;
            border: none;
            border-radius: 9999px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow:
                4px 6px 14px rgba(248, 159, 27, 0.25),
                -3px -3px 8px var(--clay-shadow-light),
                inset 2px 2px 4px rgba(255, 255, 255, 0.8),
                inset -2px -2px 4px rgba(248, 159, 27, 0.2);
            transition: transform 0.15s ease;
        }

        [data-theme="dark"] .leetcode-premium-btn {
            background: linear-gradient(135deg, #42301c, #2e2013);
            color: #FFA116;
            box-shadow:
                4px 6px 14px rgba(0, 0, 0, 0.4),
                -2px -2px 6px rgba(255, 255, 255, 0.05),
                inset 2px 2px 4px rgba(255, 255, 255, 0.08),
                inset -2px -2px 4px rgba(0, 0, 0, 0.3);
        }

        /* ============================================================
           CLAY LOGIN CARD
        ============================================================ */
        .login-page-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .leetcode-card {
            background: var(--leetcode-card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 28px;
            box-shadow:
                14px 18px 36px var(--clay-shadow-dark),
                -12px -12px 28px var(--clay-shadow-light),
                inset -6px -6px 14px var(--clay-inner-dark),
                inset 6px 6px 14px var(--clay-inner-light);
            padding: 40px 36px 36px;
            text-align: center;
            border: none;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .leetcode-logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }

        .leetcode-brand-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--leetcode-text);
            margin-top: 10px;
            letter-spacing: -0.3px;
        }

        /* Inset clay input styles */
        .leetcode-input {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 14px;
            padding: 0 16px;
            font-size: 14px;
            color: var(--leetcode-text);
            outline: none;
            margin-bottom: 16px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.03);
            box-shadow:
                inset 3px 3px 6px var(--clay-inner-dark),
                inset -2px -2px 5px var(--clay-inner-light);
            transition: box-shadow 0.2s;
        }

        [data-theme="dark"] .leetcode-input {
            background: rgba(0, 0, 0, 0.25);
        }

        .leetcode-input:focus {
            box-shadow:
                inset 3px 3px 6px var(--clay-inner-dark),
                inset -2px -2px 5px var(--clay-inner-light),
                0 0 0 2px var(--leetcode-orange);
        }

        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: left;
        }

        /* Inset clay captcha box */
        .captcha-box {
            border: none;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.02);
            box-shadow:
                inset 2px 2px 5px var(--clay-inner-dark),
                inset -2px -2px 5px var(--clay-inner-light);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        [data-theme="dark"] .captcha-box {
            background: rgba(0, 0, 0, 0.2);
        }

        .captcha-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Raised clay check circle */
        .captcha-check {
            width: 24px;
            height: 24px;
            background: #34a853;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                2px 3px 8px rgba(52, 168, 83, 0.35),
                inset 1px 1px 3px rgba(255, 255, 255, 0.7);
        }

        .captcha-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--leetcode-text);
        }

        .cloudflare-logo {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 9px;
            color: var(--leetcode-muted);
            line-height: 1.2;
        }

        /* Raised clay submit button */
        .leetcode-submit-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, var(--leetcode-btn), var(--leetcode-btn-hover));
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--btn-clay-shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .leetcode-submit-btn:hover {
            transform: translateY(-2px);
        }

        .leetcode-submit-btn:active {
            transform: scale(0.98);
            box-shadow:
                inset 4px 4px 10px var(--clay-shadow-dark),
                inset -3px -3px 8px var(--clay-shadow-light);
        }

        .leetcode-submit-btn:disabled {
            opacity: 0.6;
            cursor: default;
            transform: none;
        }

        .leetcode-card-links {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 13px;
        }

        .leetcode-card-links a {
            color: var(--leetcode-muted);
            text-decoration: none;
            transition: color 0.15s;
        }

        .leetcode-card-links a:hover {
            color: var(--leetcode-text);
        }

        .social-divider {
            margin-top: 24px;
            font-size: 12px;
            color: var(--leetcode-muted);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 14px;
        }

        /* Raised circular clay social button */
        .social-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--leetcode-card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--leetcode-text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow:
                4px 4px 10px var(--clay-shadow-dark),
                -2px -2px 6px var(--clay-shadow-light),
                inset -2px -2px 4px var(--clay-inner-dark),
                inset 2px 2px 4px var(--clay-inner-light);
            transition: transform 0.15s ease;
        }

        .social-icon-btn:hover {
            transform: translateY(-2px);
        }

        .social-icon-btn:active {
            transform: scale(0.95);
            box-shadow:
                inset 2px 2px 5px var(--clay-shadow-dark),
                inset -1px -1px 3px var(--clay-shadow-light);
        }

        /* App view fallback clay elements */
        .app-frame {
            background: var(--leetcode-card-bg);
            border-radius: 28px;
            box-shadow:
                14px 18px 36px var(--clay-shadow-dark),
                -12px -12px 28px var(--clay-shadow-light),
                inset -6px -6px 14px var(--clay-inner-dark),
                inset 6px 6px 14px var(--clay-inner-light);
        }

        .note-item {
            background: var(--leetcode-card-bg);
            border-radius: 16px;
            box-shadow:
                6px 8px 18px var(--clay-shadow-dark),
                -4px -4px 12px var(--clay-shadow-light),
                inset -2px -2px 5px var(--clay-inner-dark),
                inset 2px 2px 5px var(--clay-inner-light);
        }
    </style>
</head>

<body>

    <!-- LeetCode Header Navigation -->
    <nav class="leetcode-nav">
        <div class="leetcode-nav-left">
            <div class="leetcode-logo-nav">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M16.102 17.93l-2.697 2.607c-.466.467-1.111.662-1.823.662s-1.357-.195-1.824-.662l-4.332-4.363c-.467-.467-.702-1.15-.702-1.863 0-.713.235-1.357.702-1.824l4.319-4.38c.467-.467 1.125-.645 1.837-.645s1.357.195 1.824.662l2.697 2.606c.514.515 1.365.497 1.9-.038.535-.536.553-1.387.039-1.901l-2.606-2.636a4.994 4.994 0 00-3.855-1.42 5.01 5.01 0 00-3.855 1.42L3.398 12.08a5.006 5.006 0 000 7.086l4.332 4.363a4.995 4.995 0 003.553 1.47 5.011 5.011 0 003.553-1.47l2.697-2.607c.514-.514.496-1.365-.039-1.901-.535-.535-1.386-.552-1.9-.038z" fill="#FFA116"/>
                    <path d="M10.74 9.64l4.319-4.38a4.994 4.994 0 013.553-1.42 5.01 5.01 0 013.553 1.42l.5.5c.515.515.497 1.366-.038 1.901-.536.536-1.387.553-1.902.039l-.5-.5a2.505 2.505 0 00-1.824-.662 2.497 2.497 0 00-1.824.662l-4.319 4.38a1.356 1.356 0 000 1.902c.515.514 1.366.496 1.902-.039z" fill="#262626"/>
                </svg>
            </div>
            <div class="leetcode-nav-links">
                <a href="#">Explore</a>
                <a href="#">Problems</a>
                <a href="#">Contest</a>
                <a href="#">Discuss</a>
                <a href="#">Interview ▾</a>
                <a href="#" style="color:#FFA116;">Store ▾</a>
            </div>
        </div>
        <div class="leetcode-nav-right">
            <div class="leetcode-search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Search
            </div>
            <button class="leetcode-icon-btn" aria-label="Notifications"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
            <button class="leetcode-icon-btn" aria-label="Streak" style="gap:4px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>0</button>
            <button class="leetcode-premium-btn">Premium</button>
        </div>
    </nav>

    <!-- Center Login Card -->
    <div class="login-page-container">
        <div class="leetcode-card" id="card">
            <!-- content injected by JS -->
        </div>
    </div>

    <script>
        // ---- App state ----
        let currentUser = null;
        let loading = false;
        let errorMsg = '';

        // ---- Notes state (step 2) ----
        let notes = [];          // array of { id, text, author, createdAt }
        let notesLoaded = false; // have we fetched from storage yet?
        let notesError = '';

        // ---- Messages state (step 3) ----
        let activeTab = 'home'; // 'home' | 'notes' | 'messages' | 'photos' | 'settings' | 'reminders'
        let messages = [];        // array of { id, author, text, createdAt, expiresAt }
        let messagesLoaded = false;
        let messagesError = '';
        let editingMessageId = null; // if set, Save will UPDATE this message instead of creating a new one

        const card = document.getElementById('card');

        // ---- Rendering ----
        function render() {
            if (currentUser) {
                renderApp();
                return;
            }

            card.innerHTML = `
                <div class="leetcode-logo-center">
                    <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
                        <path d="M16.102 17.93l-2.697 2.607c-.466.467-1.111.662-1.823.662s-1.357-.195-1.824-.662l-4.332-4.363c-.467-.467-.702-1.15-.702-1.863 0-.713.235-1.357.702-1.824l4.319-4.38c.467-.467 1.125-.645 1.837-.645s1.357.195 1.824.662l2.697 2.606c.514.515 1.365.497 1.9-.038.535-.536.553-1.387.039-1.901l-2.606-2.636a4.994 4.994 0 00-3.855-1.42 5.01 5.01 0 00-3.855 1.42L3.398 12.08a5.006 5.006 0 000 7.086l4.332 4.363a4.995 4.995 0 003.553 1.47 5.011 5.011 0 003.553-1.47l2.697-2.607c.514-.514.496-1.365-.039-1.901-.535-.535-1.386-.552-1.9-.038z" fill="#FFA116"/>
                        <path d="M10.74 9.64l4.319-4.38a4.994 4.994 0 013.553-1.42 5.01 5.01 0 013.553 1.42l.5.5c.515.515.497 1.366-.038 1.901-.536.536-1.387.553-1.902.039l-.5-.5a2.505 2.505 0 00-1.824-.662 2.497 2.497 0 00-1.824.662l-4.319 4.38a1.356 1.356 0 000 1.902c.515.514 1.366.496 1.902-.039z" fill="#262626"/>
                    </svg>
                    <div class="leetcode-brand-name">LeetCode</div>
                </div>

                <input class="leetcode-input" id="username" type="text" placeholder="Username or E-mail" autocomplete="off" />
                <input class="leetcode-input" id="password" type="password" placeholder="Password" autocomplete="off" />

                ${errorMsg ? `<div class="error" id="errorMsg">${escapeHtml(errorMsg)}</div>` : ''}

                <div class="captcha-box">
                    <div class="captcha-left">
                        <div class="captcha-check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                        <span class="captcha-text">Success!</span>
                    </div>
                    <div class="cloudflare-logo">
                        <span style="font-weight:700;color:#f38020;">CLOUDFLARE</span>
                        <span>Privacy • Terms</span>
                    </div>
                </div>

                <button class="leetcode-submit-btn" id="submitBtn" ${loading ? 'disabled' : ''}>
                    ${loading ? 'Signing In...' : 'Sign In'}
                </button>

                <div class="leetcode-card-links">
                    <a href="#">Forgot Password?</a>
                    <a href="#">Sign Up</a>
                </div>

                <div class="social-divider">or you can sign in with</div>

                <div class="social-icons">
                    <div class="social-icon-btn">G</div>
                    <div class="social-icon-btn" aria-label="GitHub"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg></div>
                    <div class="social-icon-btn">f</div>
                    <div class="social-icon-btn">...</div>
                </div>
            `;

            document.getElementById('submitBtn').onclick = handleSubmit;

            // allow Enter key to submit
            card.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('keydown', e => {
                    if (e.key === 'Enter') handleSubmit();
                });
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ---- Password hashing ----
        // No longer needed on the client — the server hashes and compares.
        // Removed: hashPassword(), getUsers(), saveUsers()

        // ---- Submit handler ----
        // Calls the backend API instead of checking localStorage
        async function handleSubmit() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            errorMsg = '';

            if (!username || !password) {
                errorMsg = 'Please fill in both fields.';
                render();
                return;
            }

            loading = true;
            render();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    errorMsg = data.error || 'Name or password is incorrect.';
                } else {
                    currentUser = data.username;
                    sessionStorage.setItem('currentUser', data.username);
                    window.location.href = 'main.html';
                    return; // stop further execution
                }
            } catch (e) {
                errorMsg = 'Something went wrong. Please try again.';
                console.error(e);
            }

            loading = false;
            render();
        }


        // ==== NOTES (step 2) ====
        // Now backed by the Supabase API instead of localStorage.

        async function loadNotes() {
            try {
                const res = await fetch('/api/notes');
                if (!res.ok) throw new Error('Failed to load notes');
                notes = await res.json();
                // Map Supabase column names to the ones our UI expects
                notes = notes.map(n => ({
                    id: String(n.id),
                    text: n.text,
                    author: n.author,
                    createdAt: n.created_at
                }));
            } catch (e) {
                console.error('loadNotes:', e);
                notes = [];
            }
            notesLoaded = true;
        }

        async function addNote(text) {
            const res = await fetch('/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author: currentUser, text })
            });
            if (!res.ok) throw new Error('Failed to add note');
            // Reload from server to stay in sync
            await loadNotes();
        }

        async function deleteNote(id) {
            const res = await fetch(`/api/notes/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Failed to delete note');
            await loadNotes();
        }


        function formatWhen(iso) {
            const d = new Date(iso);
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
                ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        }

        // ==== APP FRAME (step 3): header 30% / main 60%, with tabs ====

        const TAB_LABELS = { home: 'Home', notes: 'Notes', messages: 'Messages', photos: 'Photos', settings: 'Settings', reminders: 'Reminders' };

        async function renderApp() {
            // Fetch data lazily, once, the first time each tab is needed
            if (!notesLoaded) await loadNotes();
            if (!messagesLoaded) await loadMessages();

            card.innerHTML = `
      <div class="app-frame">
        <div class="app-header">
          <div class="top-bar">
            <div>
              <h1>Our Space</h1>
              <div class="signed-in-as">Signed in as ${escapeHtml(currentUser)}</div>
            </div>
            <button class="logout" id="logoutBtn">Log out</button>
          </div>
          <div class="tabs">
            ${Object.keys(TAB_LABELS).map(key => `
              <button class="tab-btn ${activeTab === key ? 'active' : ''}" data-tab="${key}">${TAB_LABELS[key]}</button>
            `).join('')}
          </div>
        </div>

        <div class="app-main" id="appMain">
          ${contentForActiveTab()}
        </div>
      </div>
    `;

            document.getElementById('logoutBtn').onclick = () => {
                currentUser = null;
                render();
            };
            document.querySelectorAll('[data-tab]').forEach(btn => {
                btn.onclick = () => { activeTab = btn.dataset.tab; renderApp(); };
            });
            document.querySelectorAll('[data-goto]').forEach(btn => {
                btn.onclick = () => { activeTab = btn.dataset.goto; renderApp(); };
            });

            if (activeTab === 'notes') wireNotesTab();
            else if (activeTab === 'messages') wireMessagesTab();
        }

        function contentForActiveTab() {
            switch (activeTab) {
                case 'home': return homeTabHtml();
                case 'notes': return notesTabHtml();
                case 'messages': return messagesTabHtml();
                default: return stubTabHtml(TAB_LABELS[activeTab]);
            }
        }

        // ---- Home page: greeting, quick overview, navigation ----
        function greetingForNow() {
            const h = new Date().getHours();
            if (h < 12) return 'Good morning';
            if (h < 18) return 'Good afternoon';
            return 'Good evening';
        }

        function homeTabHtml() {
            const activeMessages = messages.filter(m => new Date(m.expiresAt) > new Date());
            const navItems = [
                { key: 'notes', label: 'Notes', desc: notes.length + ' saved' },
                { key: 'messages', label: 'Messages', desc: activeMessages.length + ' active' },
                { key: 'photos', label: 'Photos', desc: 'coming soon' },
                { key: 'settings', label: 'Settings', desc: 'coming soon' },
                { key: 'reminders', label: 'Reminders', desc: 'coming soon' }
            ];
            return `
      <h1 style="font-size:1.2rem;text-align:left;margin-bottom:2px;">${greetingForNow()}, ${escapeHtml(currentUser)}</h1>
      <p style="color:var(--dusk);font-size:0.85rem;margin-top:0;">Here's your space.</p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;">
        ${navItems.map(item => `
          <button data-goto="${item.key}" style="text-align:left;cursor:pointer;background:rgba(255,255,255,0.55);border:1px solid var(--line, #dbe4c9);border-radius:8px;padding:14px;font-family:'Work Sans',sans-serif;">
            <div style="font-weight:600;font-size:0.92rem;color:var(--ink);">${item.label}</div>
            <div style="font-size:0.75rem;color:var(--dusk);margin-top:3px;">${item.desc}</div>
          </button>
        `).join('')}
      </div>
    `;
        }

        function stubTabHtml(label) {
            return `
      <div class="empty-state" style="padding:40px 0;">
        <div style="font-family:'Fraunces',serif;font-size:1.1rem;color:var(--ink);margin-bottom:6px;">${escapeHtml(label)}</div>
        We'll build this together soon.
      </div>
    `;
        }

        // ---- Notes tab (same behavior as step 2, just reused inside the frame) ----
        function notesTabHtml() {
            return `
      <textarea id="noteInput" placeholder="Write something for the two of you..."></textarea>
      <button class="add-btn" id="addBtn">Save note</button>
      <div class="error" id="notesError">${notesError}</div>

      <div class="notes-list" id="notesList">
        ${notes.length === 0
                    ? `<div class="empty-state">Nothing saved yet — write your first note above.</div>`
                    : notes.map(n => `
              <div class="note-item">
                <p class="note-text">${escapeHtml(n.text)}</p>
                <div class="note-meta">
                  <span>${escapeHtml(n.author)} · ${formatWhen(n.createdAt)}</span>
                  <button class="delete-btn" data-id="${n.id}">delete</button>
                </div>
              </div>
            `).join('')}
      </div>
    `;
        }

        function wireNotesTab() {
            document.getElementById('addBtn').onclick = async () => {
                const input = document.getElementById('noteInput');
                const text = input.value.trim();
                if (!text) return;

                document.getElementById('addBtn').disabled = true;
                try {
                    await addNote(text);
                    notesError = '';
                    renderApp();
                } catch (e) {
                    notesError = 'Could not save — please try again.';
                    renderApp();
                }
            };

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = async () => {
                    await deleteNote(btn.dataset.id);
                    renderApp();
                };
            });
        }

        // ---- Messages tab (step 3) ----
        const WEEK_MS = 7 * 24 * 60 * 60 * 1000; // one week, in milliseconds

        // ---- Starred helpers (shared with main.html via localStorage) ----
        function getStarredItems() {
            try { return JSON.parse(localStorage.getItem('starredItems') || '[]'); } catch { return []; }
        }

        function saveStarredItems(arr) {
            localStorage.setItem('starredItems', JSON.stringify(arr));
        }

        function isLiked(messageId) {
            return getStarredItems().some(s => s.messageId === messageId);
        }

        function toggleLike(msg) {
            let arr = getStarredItems();
            const idx = arr.findIndex(s => s.messageId === msg.id);
            if (idx !== -1) {
                arr.splice(idx, 1); // un-like
            } else {
                arr.unshift({
                    messageId: msg.id,
                    text: msg.text,
                    author: msg.author,
                    likedAt: new Date().toISOString()
                });
            }
            saveStarredItems(arr);
        }

        function messagesTabHtml() {
            const visible = messages.filter(m => new Date(m.expiresAt) > new Date());
            return `
      <textarea id="msgInput" placeholder="Write a private message...">${editingMessageId ? escapeHtml(messages.find(m => m.id === editingMessageId)?.text || '') : ''}</textarea>
      ${editingMessageId ? `<div class="editing-banner">Editing a message — Save to update it.</div>` : ''}
      <button class="save-btn" id="saveMsgBtn">${editingMessageId ? 'Update message' : 'Save message'}</button>
      <div class="error" id="messagesError">${messagesError}</div>

      <div class="notes-list" id="messagesList">
        ${visible.length === 0
                    ? `<div class="empty-state">No messages yet — write one above.</div>`
                    : visible.map(m => `
              <div class="msg-item">
                <div class="msg-author">${escapeHtml(m.author)}</div>
                <p class="msg-text">${escapeHtml(m.text)}</p>
                <div class="msg-footer">
                  <span class="msg-expiry">expires ${formatWhen(m.expiresAt)}</span>
                  <div class="msg-actions">
                    <button class="like-btn" data-id="${m.id}" data-action="like"
                      title="${isLiked(m.id) ? 'Remove from favourites' : 'Add to favourites'}">
                      ${isLiked(m.id) ? '★' : '☆'}
                    </button>
                    <button class="alter-btn" data-id="${m.id}" data-action="alter">alter</button>
                    <button class="delete-btn" data-id="${m.id}" data-action="delete">delete</button>
                  </div>
                </div>
              </div>
            `).join('')}
      </div>
    `;
        }

        function wireMessagesTab() {
            document.getElementById('saveMsgBtn').onclick = async () => {
                const input = document.getElementById('msgInput');
                const text = input.value.trim();
                if (!text) return;

                document.getElementById('saveMsgBtn').disabled = true;
                try {
                    if (editingMessageId) {
                        await updateMessage(editingMessageId, text);
                        editingMessageId = null;
                    } else {
                        await publishMessage(text);
                    }
                    messagesError = '';
                    renderApp();
                } catch (e) {
                    messagesError = 'Could not save — please try again.';
                    renderApp();
                }
            };

            // ⭐ Like / unlike — saves to starredItems for main.html
            document.querySelectorAll('[data-action="like"]').forEach(btn => {
                btn.onclick = () => {
                    const msg = messages.find(m => m.id === btn.dataset.id);
                    if (!msg) return;
                    toggleLike(msg);
                    // Re-render just this button to give instant feedback
                    const liked = isLiked(msg.id);
                    btn.textContent = liked ? '★' : '☆';
                    btn.title = liked ? 'Remove from favourites' : 'Add to favourites';
                };
            });

            document.querySelectorAll('[data-action="alter"]').forEach(btn => {
                btn.onclick = () => {
                    editingMessageId = btn.dataset.id;
                    renderApp();
                };
            });

            document.querySelectorAll('[data-action="delete"]').forEach(btn => {
                btn.onclick = async () => {
                    await deleteMessage(btn.dataset.id);
                    renderApp();
                };
            });
        }

        // Now backed by the Supabase API instead of localStorage.
        async function loadMessages() {
            try {
                const res = await fetch('/api/messages');
                if (!res.ok) throw new Error('Failed to load messages');
                messages = await res.json();
                // Map Supabase column names to the ones our UI expects
                messages = messages.map(m => ({
                    id: String(m.id),
                    author: m.author,
                    text: m.text,
                    createdAt: m.created_at,
                    expiresAt: m.expires_at
                }));
            } catch (e) {
                console.error('loadMessages:', e);
                messages = [];
            }
            messagesLoaded = true;
        }

        async function publishMessage(text) {
            const res = await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author: currentUser, text })
            });
            if (!res.ok) throw new Error('Failed to create message');
            await loadMessages();
        }

        async function updateMessage(id, text) {
            const res = await fetch(`/api/messages/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            if (!res.ok) throw new Error('Failed to update message');
            await loadMessages();
        }

        async function deleteMessage(id) {
            const res = await fetch(`/api/messages/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Failed to delete message');
            await loadMessages();
        }

        // ---- Startup ----
        // Seeding is handled by the server on startup, so we just render.
        render();

    
        // Apply saved or default dark theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

</body>

</html>
